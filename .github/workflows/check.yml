# Check für 6Pack: Build + Regressionstests auf jedem PR/dev-Push, ohne Deploy und ohne Firebase-Secrets.
#
# Gleicher Aufbau wie deploy.yml (6Pack deploy), aber ohne Pfadfilter und ohne Deploy
# (Muster aus fitness-dev/check.yml).

name: Check (6Pack)

on:
  workflow_dispatch:
  push:
    branches: [dev]
  pull_request:
    branches: [master, dev]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install
        run: pnpm install --ignore-scripts

      - name: Build (inkl. build:data aus catalog/; Stempel = Splash + Service Worker)
        run: pnpm run build

      - name: Calendar reminder regression checks
        run: pnpm run test:calendar

      - name: Workout catalog validation checks
        run: node --test scripts/test-workout-validation.mjs

      - name: Equipment and video preview checks
        run: |
          node scripts/test-workout-equipment.mjs
          node scripts/test-exercise-video-preview.mjs

      - name: Exercise preview regression checks
        run: node scripts/test-exercise-details.mjs

      - name: Exercise video mapping checks
        run: node scripts/test-exercise-video.mjs

      - name: Local video control regressions
        run: pnpm run test:video-control

      - name: Local video control build
        run: pnpm run build:video-control

      - name: In-app update prompt
        run: node --test scripts/test-app-update.mjs

      - name: Shared Skills regressions
        run: pnpm run test:skills

      - name: Core Skills build
        run: pnpm run build:skills
