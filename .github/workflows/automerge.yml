# Auto-Promote dev -> master (ersetzt den alten PR-basierten Auto-Merge).
# Ziel: nichts bleibt auf dev liegen. Ablauf:
#   Check auf dev gruen            -> master wird per Fast-Forward auf dev gezogen, Live-Deploy per Dispatch
#   dev hinter master              -> dev wird per Fast-Forward auf master gezogen
#   beide haben eigene Commits     -> roter Lauf (kommt nur nach direktem Push auf master vor): von Hand mit normalem Push zusammenfuehren
# Rot bleibt liegen (kein Promote). Ein Zeitplan (alle 30 Min) faengt haengende Faelle ab. Fast-Forward statt Merge-Commit auf master, weil der Branch-Schutz den Check
# `check` fuer genau diesen Commit verlangt. Der Check zaehlt nur, wenn sein Workflow-Event qualifiziert
# (push, pull_request, pull_request_review, pull_request_target, deployment, deployment_status).
# workflow_dispatch ist auf dem Commit sichtbar und success, erfuellt den Context aber nicht: der Push
# antwortet GH006 "Required status check \"check\" is expected". Pushes mit GITHUB_TOKEN loesen keine
# Workflows aus -> der Deploy wird per workflow_dispatch gestartet. Laeuft aus dem Default-Branch; die Datei muss dort liegen.

name: Auto-Promote dev -> master (Check (6Pack))

on:
  workflow_run:
    workflows: ["Check (6Pack)"]
    types: [completed]
  push:
    branches: [master]
  schedule:
    - cron: '17,47 * * * *'   # Sicherungsnetz: haengende Faelle alle 30 Min abgleichen
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  checks: read

concurrency:
  group: auto-promote-${{ github.repository }}
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'dev' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      DEPLOY_FILE: deploy.yml
      CHECK_FILE: check.yml
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: dev
      - name: Abgleichen
        timeout-minutes: 10
        run: |
          set -euo pipefail
          git fetch -q origin master dev
          master=$(git rev-parse origin/master); dev=$(git rev-parse origin/dev)
          [ "$master" = "$dev" ] && { echo "dev == master, nichts zu tun."; exit 0; }

          if git merge-base --is-ancestor "$dev" "$master"; then
            echo "dev ist hinter master -> dev per Fast-Forward nachziehen."
            git push origin "${master}:refs/heads/dev"
            exit 0
          fi

          if ! git merge-base --is-ancestor "$master" "$dev"; then
            echo "::error::dev und master haben eigene Commits (jemand hat direkt auf master gepusht). Von Hand mit einem normalen Push zusammenfuehren: git merge origin/master auf dev, pushen -> Check -> dieser Workflow zieht master nach."
            exit 1
          fi

          # Neuester qualifizierender Check (6Pack). Ein juengerer workflow_dispatch
          # ueberschreibt einen aelteren push/pull_request-Lauf nicht: der Schutz
          # ignoriert Dispatch und wertet den qualifizierenden Lauf.
          eligible='^(push|pull_request|pull_request_review|pull_request_target|deployment|deployment_status)$'
          tsv=$(gh api "repos/$REPO/actions/runs?head_sha=$dev&per_page=30" \
            --jq '[.workflow_runs[] | select(.path==".github/workflows/'"$CHECK_FILE"'")] | sort_by(.run_started_at // .created_at) | reverse | .[] | [.event, .status, (.conclusion // "")] | @tsv')
          pending=0
          qual_event=""
          qual=""
          any_success=0
          while IFS=$'\t' read -r event status conclusion; do
            [ -n "${event:-}" ] || continue
            if [ "$status" != "completed" ] || [ "$conclusion" = "action_required" ]; then
              pending=1
            fi
            if [ "$conclusion" = "success" ]; then
              any_success=1
            fi
            if [ -z "$qual_event" ] && printf '%s\n' "$event" | grep -Eq "$eligible"; then
              qual_event=$event
              qual=$conclusion
            fi
          done <<< "$tsv"

          if [ "$pending" = 1 ]; then
            echo "Check fuer $dev laeuft noch oder wartet auf Freigabe -> naechster Lauf uebernimmt."
            exit 0
          fi
          if [ -z "$qual_event" ]; then
            if [ "$any_success" = 1 ]; then
              echo "Check auf $dev ist success, aber ohne qualifizierendes Event (workflow_dispatch zaehlt fuer den Branch-Schutz nicht). Kein Push auf master."
              exit 0
            fi
            echo "Check fuer $dev fehlt -> naechster Lauf uebernimmt."
            exit 0
          fi
          case "$qual" in
            success)
              echo "Qualifizierter Check ($qual_event) gruen auf $dev -> master per Fast-Forward, Live-Deploy per Dispatch."
              git push origin "${dev}:refs/heads/master"
              gh workflow run "$DEPLOY_FILE" -R "$REPO" --ref master
              ;;
            *) echo "Qualifizierter Check ($qual_event) auf $dev ist '$qual' -> bleibt auf dev liegen." ;;
          esac
