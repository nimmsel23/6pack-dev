# Auto-Merge bei grünem Check (Muster aus fitness-dev, dort die Referenz):
#   - Release-PR dev -> master (vos-release-pr): Merge-Commit (kein Squash, sonst driftet dev),
#     danach wird deploy.yml per workflow_dispatch gestartet, weil ein Merge mit
#     GITHUB_TOKEN keinen push-Trigger auslöst.
# Rot bleibt liegen. Läuft als workflow_run im Kontext des Default-Branch und checkt nie
# PR-Code aus. Wirkt deshalb erst, wenn diese Datei im Default-Branch des Repos liegt.

name: Auto-Merge (grüner Check 6Pack)

on:
  workflow_run:
    workflows: ["Check (6Pack)"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_branch == 'dev'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Mergen, wenn der grüne Lauf dem aktuellen PR-Stand entspricht
        run: |
          pr=$(gh pr list -R "$REPO" --head "$BRANCH" --base master --state open --json number,headRefOid \
            --jq ".[] | select(.headRefOid == \"$SHA\") | .number")
          [ -n "$pr" ] || { echo "Kein offener PR mit Stand $SHA (veraltet oder schon gemergt)."; exit 0; }
          gh pr merge "$pr" -R "$REPO" --merge
          gh workflow run deploy.yml -R "$REPO" --ref master
