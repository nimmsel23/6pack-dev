# Pull Request (nach dev oder vitalos): eigener 24h-PR-Channel mit Kommentar (PR-Weg wie fitness-dev;
# Check (6Pack) und Auto-Merge für den Release-PR dev -> vitalos liegen in check.yml/automerge.yml).
# Branch dev: 24h-Preview-Channel "dev" mit Telegram-Link.
# Branch vitalos: Standalone-Site vos-6pack.web.app mit Telegram-Nachricht.
# vitalos.web.app (Meta-Repo-Shell) wird separat durch dessen Workflow deployt.
# Hosting-Ziel "sixpack" im Projekt fitness-aos, siehe .firebaserc.
# Ohne Firebase-Secret wird nur gebaut und der Deploy übersprungen.
#
# Benötigte Repo-Secrets:
#   FIREBASE_SERVICE_ACCOUNT_FITNESS_AOS (oder FIREBASE_SERVICE_ACCOUNT)
#   TELEGRAM_TO + TELEGRAM_TOKEN (optional, für die Benachrichtigung)

#
# Die dev-Branch-Änderungen bleiben Preview; der Production-Submodule-Branch
# vitalos deployt die Standalone-Site, ohne die Meta-Repo-Shell zu ändern.

name: 6Pack deploy (preview + standalone)

on:
  workflow_dispatch:
  push:
    branches: [dev, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.githooks/**'
      - '.claude/**'
      - '**.txt'
      - '**.bak*'
  pull_request:
    branches: [dev, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.githooks/**'
      - '.claude/**'
      - '**.txt'
      - '**.bak*'

# Pro Ref, sonst bricht ein PR-Lauf einen laufenden Live-Deploy (vitalos) ab.
concurrency:
  group: deploy-vos-6pack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    env:
      TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FITNESS_AOS || secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: pnpm install --ignore-scripts   # kein Lockfile im Repo (pnpm-Workspace in vitalos/fitness-dev)

      - name: "Build (inkl. build:data aus catalog/; Stempel = Splash + Service Worker)"
        run: pnpm run build

      - name: Calendar reminder regression checks
        run: pnpm run test:calendar

      - name: Exercise preview regression checks
        run: node scripts/test-exercise-details.mjs

      - name: Hinweis - Secret fehlt
        if: env.FIREBASE_SA == ''
        run: echo "::warning::Secret FIREBASE_SERVICE_ACCOUNT_FITNESS_AOS fehlt - Deploy übersprungen."

      - name: Preview-Channel (dev-Push -> dev, PR -> PR-Channel, 24h)
        if: env.FIREBASE_SA != '' && (github.event_name == 'pull_request' || github.ref_name == 'dev')
        id: firebase_preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FITNESS_AOS || secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: fitness-aos
          target: sixpack
          channelId: ${{ github.event_name != 'pull_request' && 'dev' || '' }}
          expires: 24h

      - name: Standalone 6Pack (live)
        if: env.FIREBASE_SA != '' && github.event_name != 'pull_request' && github.ref_name == 'master'
        id: firebase_live
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FITNESS_AOS || secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: fitness-aos
          target: sixpack
          channelId: live

      - name: Telegram Preview-Benachrichtigung
        if: success() && env.FIREBASE_SA != '' && env.TELEGRAM_TO != '' && (github.event_name == 'pull_request' || github.ref_name == 'dev')
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🔍 6Pack-Preview (${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || 'dev' }}, 24h) deployed!

            🔗 ${{ steps.firebase_preview.outputs.details_url }}

            Commit: ${{ github.event.pull_request.title || github.event.head_commit.message }}

      - name: Telegram Standalone-Benachrichtigung
        if: success() && env.FIREBASE_SA != '' && env.TELEGRAM_TO != '' && github.event_name != 'pull_request' && github.ref_name == 'master'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚀 6Pack Standalone deployed!

            🔗 ${{ steps.firebase_live.outputs.details_url }}

            Commit: ${{ github.event.head_commit.message }}
