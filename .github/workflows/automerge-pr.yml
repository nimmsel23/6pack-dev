# PR-AutoMerge: geoeffnete Dependabot-PRs (-> dev).
# Liegt der PR-Head als Fast-Forward auf dev und hat der Commit einen qualifizierenden
# Check (push/pull_request/..., nicht workflow_dispatch), wird dev auf genau diesen
# SHA gezogen. Squash wuerde einen neuen Commit ohne diesen Check erzeugen; der
# anschliessende workflow_dispatch erfuellt den Branch-Schutz auf master nicht
# (GH006 "Required status check \"check\" is expected"). Danach stoesst der Lauf
# automerge.yml an, der master per Fast-Forward nachzieht.
# Ist kein Fast-Forward moeglich, bleibt der PR offen: Dependabot rebased, der neue
# Head bekommt einen qualifizierenden Check, der naechste Lauf zieht dev nach.
# Rot bleibt liegen. Wirkt erst, wenn diese Datei im Default-Branch liegt.

name: PR-AutoMerge (Dependabot -> dev)

on:
  workflow_run:
    workflows: ["Check (6Pack)"]
    types: [completed]
  schedule:
    - cron: '27 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: pr-automerge
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request' &&
       startsWith(github.event.workflow_run.head_branch, 'dependabot/'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: dev
      # CI.md Fallensteller base=master: trotz target-branch:dev öffnet Dependabot
      # manchmal gegen master; --base-dev-Filter lässt grüne PRs liegen. SSOT-Pattern
      # (Org 0e25e4c4 / c1f9b6ce): nur dependabot/*-Heads retargeten — Drafts/Non-Dep
      # (z. B. #42) bleiben unberührt. Folge-Port andere Repos nach Beleg.
      - name: Dependabot base=master auf base=dev retargeten
        run: |
          set -euo pipefail
          prs=$(gh pr list -R "$REPO" --base master --state open \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("dependabot/")) | [.number, .headRefName] | @tsv')
          while IFS=$'\t' read -r n branch; do
            [ -n "${n:-}" ] || continue
            echo "PR #$n ($branch): base=master -> retarget base=dev"
            if ! gh pr edit "$n" -R "$REPO" --base dev; then
              echo "::warning::Retarget von PR #$n fehlgeschlagen."
            fi
          done <<< "$prs"
      - name: Gruene Dependabot-PRs auf dev bringen
        id: land
        run: |
          set -euo pipefail
          ff=0
          eligible='^(push|pull_request|pull_request_review|pull_request_target|deployment|deployment_status)$'
          gate() {
            local sha="$1" tsv pending=0 qual_event="" qual="" any_success=0 event status conclusion
            tsv=$(gh api "repos/$REPO/actions/runs?head_sha=$sha&per_page=30" \
              --jq '[.workflow_runs[] | select(.path==".github/workflows/check.yml")] | sort_by(.run_started_at // .created_at) | reverse | .[] | [.event, .status, (.conclusion // "")] | @tsv')
            while IFS=$'\t' read -r event status conclusion; do
              [ -n "${event:-}" ] || continue
              if [ "$status" != "completed" ] || [ "$conclusion" = "action_required" ]; then
                pending=1
              fi
              if [ "$conclusion" = "success" ]; then
                any_success=1
              fi
              if [ -z "$qual_event" ] && printf '%s\n' "$event" | grep -Eq "$eligible"; then
                qual_event=$event
                qual=$conclusion
              fi
            done <<< "$tsv"
            if [ "$pending" = 1 ]; then echo pending; return; fi
            if [ -n "$qual_event" ]; then
              if [ "$qual" = "success" ]; then echo "success $qual_event"; else echo "bad $qual"; fi
              return
            fi
            if [ "$any_success" = 1 ]; then echo ineligible; else echo none; fi
          }
          git fetch -q origin dev
          devsha=$(git rev-parse origin/dev)
          prs=$(gh pr list -R "$REPO" --base dev --state open \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("dependabot/")) | [.number, .headRefName] | @tsv')
          while IFS=$'\t' read -r n branch; do
            [ -n "${n:-}" ] || continue
            git fetch -q origin "refs/heads/${branch}:refs/remotes/origin/${branch}" || { echo "::warning::PR #$n ($branch) nicht fetchbar."; continue; }
            sha=$(git rev-parse "refs/remotes/origin/${branch}")
            verdict=$(gate "$sha")
            if [ "$verdict" = "pending" ]; then
              echo "PR #$n ($branch): Check laeuft noch -> bleibt offen."
              continue
            fi
            if git merge-base --is-ancestor "$devsha" "$sha" && [ "${verdict%% *}" = "success" ]; then
              if [ "$sha" = "$devsha" ]; then
                echo "PR #$n ($branch): Head ist schon dev."
                continue
              fi
              echo "PR #$n ($branch): qualifizierter Check (${verdict#success }) auf $sha -> dev per Fast-Forward."
              git push origin "${sha}:refs/heads/dev"
              devsha=$sha
              git update-ref refs/remotes/origin/dev "$sha"
              ff=1
              continue
            fi
            echo "PR #$n ($branch): kein Fast-Forward mit qualifiziertem Check ($verdict) -> bleibt offen. Dependabot rebased, der naechste Lauf zieht den neuen Head nach."
          done <<< "$prs"
          echo "ff=$ff" >> "$GITHUB_OUTPUT"
      - name: Auto-Promote nach Fast-Forward anstossen
        if: steps.land.outputs.ff == '1'
        run: |
          echo "dev zeigt auf einen qualifiziert geprueften Stand -> Promote anstossen (GITHUB_TOKEN-Push loest ihn nicht aus)."
          gh workflow run automerge.yml -R "$REPO" --ref master
