name: Native 6Pack builds

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native build target
        type: choice
        options: [both, android, ios]
        default: both

permissions:
  contents: read

jobs:
  android:
    if: inputs.platform == 'both' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run test:reminders
      - run: pnpm run build:native
      - run: pnpm exec cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: sixpack-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  ios:
    if: inputs.platform == 'both' || inputs.platform == 'ios'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run test:reminders
      - run: pnpm run build:native
      - run: pnpm exec cap sync ios
      - name: Build unsigned simulator app
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ios/DerivedData CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: sixpack-ios-simulator
          path: ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app
          retention-days: 7
