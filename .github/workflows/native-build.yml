name: Native 6Pack builds

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native build target
        type: choice
        options: [both, android, ios]
        default: both

permissions:
  contents: read

jobs:
  android:
    if: inputs.platform == 'both' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    # contents: write nur für das Release-Asset android-latest (siehe letzter Schritt)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run test:reminders
      - run: pnpm run build:native
      - run: pnpm exec cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v7
        with:
          name: sixpack-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      # Stabiler Download ohne Login: Release "android-latest" trägt immer die zuletzt gebaute Debug-APK.
      # Coach (6pack.html/portal.html) verlinkt darauf:
      # https://github.com/nimmsel23/6pack-dev/releases/download/android-latest/6pack-app-debug.apk
      - name: Release android-latest aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk 6pack-app-debug.apk
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest \
            --prerelease --target "$GITHUB_SHA" --title "6Pack Android (Debug, latest)" --notes "wird vom Workflow Native 6Pack builds überschrieben"
          gh release upload android-latest 6pack-app-debug.apk --clobber
          gh release edit android-latest --notes "Debug-APK, gebaut aus ${GITHUB_SHA::7} ($GITHUB_REF_NAME) am $(date -u +%F)"

  ios:
    if: inputs.platform == 'both' || inputs.platform == 'ios'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run test:reminders
      - run: pnpm run build:native
      - run: pnpm exec cap sync ios
      - name: Build unsigned simulator app
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ios/DerivedData CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v7
        with:
          name: sixpack-ios-simulator
          path: ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app
          retention-days: 7
