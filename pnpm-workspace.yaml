# Standalone-Build (GitHub Action) ohne vitalos-Workspace: gleiche Build-Freigaben wie ~/vitalos/pnpm-workspace.yaml
allowBuilds:
  '@firebase/util': true
  esbuild: true
  protobufjs: true

overrides:
  # 1.3.0 → __VITE_PRELOAD__{hash}-Blackscreen; gleiche Linie wie fitness-dev / VitalOS-Meta.
  # fixRolldownPreloadMarker in vite.config.js bleibt Defense-in-depth.
  rolldown: 1.2.16
  '@grpc/grpc-js@<1.13.6': '^1.14.6'
minimumReleaseAgeExclude:
  - vite@8.3.7
  - vite@8.3.6
  - '@vitejs/plugin-react@6.3.0'
  - '@vitejs/plugin-react@6.2.1'
  - framer-motion@14.11.1
  - motion-dom@14.11.1
  - eslint@10.14.0
  - '@eslint/js@10.0.1'
  - rolldown@1.2.18
  - rolldown@1.2.13
  - '@rolldown/binding-linux-x64-gnu@1.2.18'
  - '@rolldown/binding-linux-x64-musl@1.2.18'
  - '@rolldown/binding-darwin-arm64@1.2.18'
  - '@rolldown/binding-darwin-x64@1.2.18'
  - '@rolldown/binding-win32-x64-msvc@1.2.18'
  - '@rolldown/pluginutils@1.2.18'
